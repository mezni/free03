services:
  # Streamlit Web UI Service
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: relay-agent-ui
    ports:
      - "8501:8501"
    env_file:
      - .env
    environment:
      - PYTHONPATH=/app
    restart: unless-stopped

  # CLI Execution Service (Optional / One-off runner)
  cli:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: relay-agent-cli
    env_file:
      - .env
    environment:
      - PYTHONPATH=/app
    command: uv run python src/main.py
    profiles:
      - cli
