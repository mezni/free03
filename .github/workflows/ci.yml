name: CI & Agent Evals Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-eval:
    name: Lint & Run Evals
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout the repository
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Set up Python environment
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 3. Install Astral uv
      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
          enable-cache: true

      # 4. Sync dependencies
      - name: Install Dependencies
        run: uv sync --frozen

      # 5. Run Ruff Linter & Formatter Check
      - name: Run Ruff Lint & Format Checks
        run: |
          uv run ruff check .
          uv run ruff format --check .

      # 6. Run Pytest Suite & Multi-Agent Evals
      - name: Run Pytest and Agent Evals
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PYTHONPATH: .
        run: uv run pytest -v
